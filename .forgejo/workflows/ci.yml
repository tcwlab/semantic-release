# ─────────────────────────────────────────────────────────────────────────────
# chameleon-ci / semantic-release — Build & Publish
#
# Workflow:
#   feature/* / claude/*  → lint + build + smoke-test + trivy
#   main (nach Merge)     → + release (semantic-release → semver + Docker push)
#
# Docker-Tags:
#   tcwlab/semantic-release:<semver>   immutable
#   tcwlab/semantic-release:latest     float
# ─────────────────────────────────────────────────────────────────────────────

name: ci

on:
  push:
    branches: [main, "feature/*", "claude/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tcwlab/semantic-release
  DOCKER_BUILDKIT: "1"

jobs:

  lint:
    name: Dockerfile Lint
    runs-on: ubuntu-22.04
    container:
      image: tcwlab/hadolint:2.12.0
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
      - name: hadolint
        run: hadolint --ignore DL3018 --ignore DL3016 Dockerfile

  build-test:
    name: Build & Smoke-Test
    runs-on: ubuntu-22.04
    container:
      image: tcwlab/buildx:0.33.0
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
      - name: Build (amd64)
        run: docker build -t "${{ env.IMAGE }}:test" .
      - name: Smoke-Test
        run: |
          docker run --rm "${{ env.IMAGE }}:test" semantic-release --version
          docker run --rm "${{ env.IMAGE }}:test" semantic-release --help | grep -q "analyze-commits"
      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Push zu Staging
        run: |
          docker tag "${{ env.IMAGE }}:test" \
            "tcwlab/forgejo-build:semantic-release-${{ github.sha }}"
          docker push "tcwlab/forgejo-build:semantic-release-${{ github.sha }}"
      - name: Trivy Scan
        run: |
          docker run --rm \
            -e TRIVY_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            -e TRIVY_PASSWORD="${{ secrets.DOCKERHUB_TOKEN }}" \
            tcwlab/trivy:0.70.0 image \
            --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed --format table \
            "tcwlab/forgejo-build:semantic-release-${{ github.sha }}"

  release:
    name: Release — Multi-Arch Push
    runs-on: ubuntu-22.04
    needs: [lint, build-test]
    if: github.ref == 'refs/heads/main'
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
      GH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_URL: https://git.mon.k8b.co
      GITHUB_API_URL: https://git.mon.k8b.co/api/v1/
    steps:
      - name: Checkout (volle History für semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "Sascha Willomitzer"
          git config --global user.email "swi@thechameleonway.com"
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch origin
          git checkout "${GITHUB_SHA}"

      - name: semantic-release
        run: |
          npx -y \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            semantic-release

      - name: Release-Version prüfen
        id: semrel
        run: |
          if [ -f .NEXT_RELEASE_VERSION ]; then
            VER=$(cat .NEXT_RELEASE_VERSION)
            echo "released=true"  >> "$GITHUB_OUTPUT"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "Release: ${VER}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Kein Release (kein feat/fix Commit seit letztem Tag)"
          fi

      - name: Install Docker CLI + buildx
        if: steps.semrel.outputs.released == 'true'
        run: |
          curl -fsSL \
            "https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz" \
            -o /tmp/docker.tgz
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL \
            "https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx

      - name: QEMU + Buildx-Builder
        if: steps.semrel.outputs.released == 'true'
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Docker Hub Login
        if: steps.semrel.outputs.released == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Push (multi-arch)
        if: steps.semrel.outputs.released == 'true'
        run: |
          VER="${{ steps.semrel.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true --provenance=mode=max \
            -t "${{ env.IMAGE }}:${VER}" \
            -t "${{ env.IMAGE }}:latest" \
            --push .
