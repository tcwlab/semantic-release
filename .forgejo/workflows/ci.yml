# ─────────────────────────────────────────────────────────────────────────────
# chameleon-ci / semantic-release — Build & Publish
#
# Workflow:
#   feature/* / claude/*  → lint + build + smoke-test + trivy (→ PR-Beschreibung)
#   main (nach Merge)     → + release (semantic-release → semver + Docker push)
#
# Docker-Tags:
#   tcwlab/semantic-release:<semrel-version>-<wrapper-semver>   immutable
#   tcwlab/semantic-release:<semrel-version>                    float
#   tcwlab/semantic-release:latest                              float
# ─────────────────────────────────────────────────────────────────────────────

name: ci

on:
  push:
    branches: [main, "feature/*", "claude/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: tcwlab/semantic-release
  DOCKER_BUILDKIT: "1"

jobs:

  lint:
    name: Dockerfile Lint
    runs-on: ubuntu-22.04
    container:
      image: tcwlab/betterlint:latest
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
      - name: hadolint
        run: betterlint --only hadolint

  build-test:
    name: Build & Smoke-Test
    runs-on: ubuntu-22.04
    container:
      image: tcwlab/buildx:0.33.0
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD
      - name: Build (amd64)
        run: docker build -t "${{ env.IMAGE }}:test" .
      - name: Smoke-Test
        run: |
          docker run --rm "${{ env.IMAGE }}:test" semantic-release --version
          docker run --rm "${{ env.IMAGE }}:test" semantic-release --help | grep -q "analyze-commits"
      - name: Docker Hub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Push zu Staging
        run: |
          docker tag "${{ env.IMAGE }}:test" \
            "tcwlab/forgejo-build:semantic-release-${{ github.sha }}"
          docker push "tcwlab/forgejo-build:semantic-release-${{ github.sha }}"

  security:
    name: Trivy Security Scan
    runs-on: ubuntu-22.04
    needs: [build-test]
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
    steps:
      - name: Install Docker CLI
        run: |
          curl -fsSL \
            "https://download.docker.com/linux/static/stable/x86_64/docker-29.4.2.tgz" \
            -o /tmp/docker.tgz
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker

      - name: Trivy Scan (JSON)
        run: |
          docker run --rm \
            -e TRIVY_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}" \
            -e TRIVY_PASSWORD="${{ secrets.DOCKERHUB_TOKEN }}" \
            tcwlab/trivy:0.70.0 image \
            --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed \
            --format json \
            "tcwlab/forgejo-build:semantic-release-${{ github.sha }}" \
            > /tmp/trivy-report.json

      - name: PR-Beschreibung mit Trivy-Ergebnis aktualisieren
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
          IMAGE_REF: "tcwlab/forgejo-build:semantic-release-${{ github.sha }}"
          RUN_DATE: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
        run: |
          python3 << 'EOF'
          import os, json, re, urllib.request, urllib.error
          from datetime import datetime, timezone

          token    = os.environ["FORGEJO_TOKEN"]
          repo     = os.environ["REPO"]
          event    = os.environ["GITHUB_EVENT_NAME"]
          base_url = "https://git.mon.k8b.co/api/v1"
          headers  = {"Authorization": f"token {token}", "Content-Type": "application/json"}

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def api_patch(url, body):
              req = urllib.request.Request(
                  url, data=json.dumps(body).encode(), headers=headers, method="PATCH"
              )
              with urllib.request.urlopen(req) as r:
                  return r.status

          # ── PR-Nummer ermitteln ──────────────────────────────────────────
          pr_number = None
          if event == "pull_request":
              pr_number = os.environ["PR_NUMBER"]
          else:
              branch = os.environ["HEAD_BRANCH"]
              try:
                  pulls = api_get(f"{base_url}/repos/{repo}/pulls?state=open&limit=50")
                  for pr in pulls:
                      if pr.get("head", {}).get("ref") == branch:
                          pr_number = str(pr["number"])
                          break
              except urllib.error.URLError as e:
                  print(f"PR-Suche fehlgeschlagen: {e}")

          if not pr_number:
              print("Kein offener PR gefunden — PR-Beschreibung wird nicht aktualisiert")
              exit(0)

          # ── Trivy-JSON einlesen ──────────────────────────────────────────
          with open("/tmp/trivy-report.json") as f:
              report = json.load(f)

          severity_icon = {"CRITICAL": "🔴", "HIGH": "🟠"}

          rows = []
          for result in report.get("Results", []):
              for vuln in result.get("Vulnerabilities") or []:
                  sev   = vuln.get("Severity", "")
                  icon  = severity_icon.get(sev, "⚪")
                  pkg   = vuln.get("PkgName", "")
                  inst  = vuln.get("InstalledVersion", "")
                  fixed = vuln.get("FixedVersion", "") or "—"
                  cve   = vuln.get("VulnerabilityID", "")
                  url   = next(
                      (r for r in vuln.get("References", []) if "nvd.nist.gov" in r),
                      vuln.get("PrimaryURL", "")
                  )
                  cve_link = f"[{cve}]({url})" if url else cve
                  rows.append((sev, icon, pkg, inst, fixed, cve_link))

          # Sortierung: CRITICAL zuerst, dann HIGH, alphabetisch nach Package
          order = {"CRITICAL": 0, "HIGH": 1}
          rows.sort(key=lambda r: (order.get(r[0], 9), r[2]))

          counts = {s: sum(1 for r in rows if r[0] == s) for s in ["CRITICAL", "HIGH"]}
          total  = sum(counts.values())

          if total == 0:
              summary = "**✅ Keine HIGH/CRITICAL Schwachstellen gefunden**"
              table   = ""
          else:
              parts   = [f"{counts[s]} {s}" for s in ["CRITICAL", "HIGH"] if counts[s]]
              summary = f"**⚠️ Security Scan — {', '.join(parts)}** (nur behebbare Schwachstellen)"
              table   = (
                  "\n| Severity | Package | Installed | Fixed | CVE |\n"
                  "|---|---|---|---|---|\n"
              )
              for _, icon, pkg, inst, fixed, cve_link in rows:
                  table += f"| {icon} | `{pkg}` | {inst} | {fixed} | {cve_link} |\n"

          scan_date = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          image_ref = os.environ["IMAGE_REF"]
          footer    = f"\n_Scan: `{image_ref}` — {scan_date}_"

          # ── Trivy-Block zusammenbauen ────────────────────────────────────
          start = "<!-- trivy-scan-chameleon-ci-start -->"
          end   = "<!-- trivy-scan-chameleon-ci-end -->"
          block = f"{start}\n{summary}{table}{footer}\n{end}"

          # ── Aktuellen PR-Body holen und Block ersetzen / voranstellen ───
          pr_data      = api_get(f"{base_url}/repos/{repo}/pulls/{pr_number}")
          current_body = pr_data.get("body", "") or ""

          if start in current_body:
              new_body = re.sub(
                  re.escape(start) + r".*?" + re.escape(end),
                  block,
                  current_body,
                  flags=re.DOTALL
              )
          else:
              new_body = block + ("\n\n" + current_body if current_body else "")

          status = api_patch(f"{base_url}/repos/{repo}/pulls/{pr_number}", {"body": new_body})
          print(f"PR #{pr_number}: Beschreibung aktualisiert ({total} Findings, HTTP {status})")
          EOF

  release:
    name: Release — Multi-Arch Push
    runs-on: ubuntu-22.04
    needs: [lint, security]
    if: github.ref == 'refs/heads/main'
    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
      GH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      GITHUB_URL: https://git.mon.k8b.co
      GITHUB_API_URL: https://git.mon.k8b.co/api/v1/
    steps:
      - name: Checkout (volle History für semantic-release)
        env:
          GITHUB_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "Sascha Willomitzer"
          git config --global user.email "swi@thechameleonway.com"
          git init .
          git remote add origin \
            "https://oauth2:${GITHUB_TOKEN}@git.mon.k8b.co/${GITHUB_REPOSITORY}.git"
          git fetch origin
          git checkout "${GITHUB_SHA}"

      - name: semantic-release
        run: |
          npx -y \
            -p semantic-release \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/github \
            -p @semantic-release/exec \
            semantic-release

      - name: Versionen extrahieren
        id: semrel
        run: |
          TOOL_VER=$(grep '^ARG SEMANTIC_RELEASE_VERSION=' Dockerfile | head -1 | cut -d= -f2)
          echo "tool_version=${TOOL_VER}" >> "$GITHUB_OUTPUT"
          if [ -f .NEXT_RELEASE_VERSION ]; then
            WRAPPER_VER=$(cat .NEXT_RELEASE_VERSION)
            echo "released=true"              >> "$GITHUB_OUTPUT"
            echo "wrapper_version=${WRAPPER_VER}" >> "$GITHUB_OUTPUT"
            echo "Release: ${TOOL_VER}-${WRAPPER_VER}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Kein Release (kein feat/fix Commit seit letztem Tag)"
          fi

      - name: Install Docker CLI + buildx
        if: steps.semrel.outputs.released == 'true'
        run: |
          curl -fsSL \
            "https://download.docker.com/linux/static/stable/x86_64/docker-29.4.2.tgz" \
            -o /tmp/docker.tgz
          tar xzf /tmp/docker.tgz --strip-components=1 -C /usr/local/bin docker/docker
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL \
            "https://github.com/docker/buildx/releases/download/v0.33.0/buildx-v0.33.0.linux-amd64" \
            -o ~/.docker/cli-plugins/docker-buildx
          chmod +x ~/.docker/cli-plugins/docker-buildx

      - name: QEMU + Buildx-Builder
        if: steps.semrel.outputs.released == 'true'
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          docker buildx create --name multiarch --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Docker Hub Login
        if: steps.semrel.outputs.released == 'true'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build & Push (multi-arch)
        if: steps.semrel.outputs.released == 'true'
        run: |
          TOOL_VER="${{ steps.semrel.outputs.tool_version }}"
          WRAPPER_VER="${{ steps.semrel.outputs.wrapper_version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --sbom=true --provenance=mode=max \
            --build-arg SEMANTIC_RELEASE_VERSION="${TOOL_VER}" \
            -t "${{ env.IMAGE }}:${TOOL_VER}-${WRAPPER_VER}" \
            -t "${{ env.IMAGE }}:${TOOL_VER}" \
            -t "${{ env.IMAGE }}:latest" \
            --push .
